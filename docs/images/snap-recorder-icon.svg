  <!-- 录制灯：灯圈、光晕、灯面与高光 -->
  <circle cx="512" cy="512" r="186" fill="#EE5A24" fill-opacity=".22" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="148" fill="#3A3936"/>
  <circle cx="512" cy="512" r="148" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="3"/>
